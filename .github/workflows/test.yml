name: tests

on:  # main only (owner, 19 Oct 2026): pushes to it and pull requests into it, never other branches
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

# A newer push to the same branch replaces a run that has not finished.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Merging a pull request already ran these tests. Python 3.9 stays on Linux.
    # macOS is a separate job: one Mac minute costs the same as ten Linux minutes.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # with the tags: the website's docs are built from the latest release tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install cryptography
      # The code map's accurate readers (C9) on the newer Python of each system; 3.9 keeps the regular expressions.
      - if: matrix.python != '3.9'
        run: python -m pip install tree-sitter tree-sitter-java tree-sitter-kotlin tree-sitter-javascript tree-sitter-typescript
      - run: python -m unittest discover -s tests -v

  test-macos:
    # Only when a release is published. A Mac minute costs the same as ten Linux minutes.
    if: github.event_name == 'release'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # with the tags: the website's docs are built from the latest release tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install cryptography
      - run: python -m pip install tree-sitter tree-sitter-java tree-sitter-kotlin tree-sitter-javascript tree-sitter-typescript
      - run: python -m unittest discover -s tests -v

  installers:
    # The one-line installers, run as a user would, against this commit.
    # A merge commit already ran on the pull request. macOS is its own job, on a release only.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          CREWCHAT_SOURCE="file://$PWD" sh install.sh
          export PATH="$HOME/.local/bin:$PATH" CREWCHAT_HOME="$RUNNER_TEMP/crewchat-home"
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project" && git init -q
          crewchat start --no-service --no-open
          crewchat status
          curl -sf "http://127.0.0.1:8765/manifest.webmanifest" > /dev/null
          crewchat cloud status || true
          "$(uv tool dir 2>/dev/null || echo "$HOME/.local/share/uv/tools")/crewchat/bin/python" -c "import google.cloud.firestore, cryptography"
          up() { curl -sf -m 3 http://127.0.0.1:8765/health > /dev/null; }
          crewchat stop
          if up; then echo "stop did not stop it"; exit 1; fi
          crewchat restart
          up || { echo "restart did not start it"; exit 1; }
          # An upgrade over a running server restarts it on the new code.
          starts() { grep -c ' for .* on http' "$CREWCHAT_HOME/hub.log"; }
          before=$(starts)
          CREWCHAT_SOURCE="file://$GITHUB_WORKSPACE" sh "$GITHUB_WORKSPACE/install.sh"
          up || { echo "an upgrade left the server stopped"; exit 1; }
          [ "$(starts)" -gt "$before" ] || { echo "an upgrade did not restart the server"; exit 1; }
          crewchat uninstall --yes
          if up; then echo "uninstall left the server running"; exit 1; fi
          hash -r  # bash remembers where it last ran crewchat; ask afresh
          if [ -e "$HOME/.local/bin/crewchat" ] || command -v crewchat; then echo "the program is still installed"; exit 1; fi
          if [ -e .mcp.json ]; then echo "uninstall left .mcp.json"; exit 1; fi
          [ -e "$CREWCHAT_HOME/config.json" ] || { echo "uninstall deleted the chats without --purge"; exit 1; }
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CREWCHAT_SOURCE = ([System.Uri](Get-Location).Path).AbsoluteUri
          .\install.ps1
          if (-not $?) { exit 1 }
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          $env:CREWCHAT_HOME = "$env:RUNNER_TEMP\crewchat-home"
          New-Item -ItemType Directory "$env:RUNNER_TEMP\project" | Out-Null
          Set-Location "$env:RUNNER_TEMP\project"
          git init -q
          crewchat start --no-service --no-open
          if ($LASTEXITCODE -ne 0) { exit 1 }
          crewchat status
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/manifest.webmanifest).StatusCode
          $tools = (uv tool dir).Trim()
          & "$tools\crewchat\Scripts\python.exe" -c "import google.cloud.firestore, cryptography"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          function Up { try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8765/health).StatusCode -eq 200 } catch { $false } }
          crewchat stop
          if ($LASTEXITCODE -ne 0 -or (Up)) { "stop did not stop it"; exit 1 }
          crewchat restart
          if ($LASTEXITCODE -ne 0 -or -not (Up)) { "restart did not start it"; exit 1 }
          # An upgrade over a running server that does not start at log on: it must come back up.
          & "$env:GITHUB_WORKSPACE\install.ps1"
          if (-not $?) { exit 1 }
          for ($i = 0; $i -lt 20 -and -not (Up); $i++) { Start-Sleep 1 }
          if (-not (Up)) { "an upgrade left the server stopped"; exit 1 }
          crewchat uninstall --yes
          if ($LASTEXITCODE -ne 0 -or (Up)) { "uninstall left the server running"; exit 1 }
          if (Test-Path .mcp.json) { "uninstall left .mcp.json"; exit 1 }
          if (-not (Test-Path "$env:CREWCHAT_HOME\config.json")) { "uninstall deleted the chats without --purge"; exit 1 }
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:USERPROFILE\.local\bin\crewchat.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$env:USERPROFILE\.local\bin\crewchat.exe") { "the program is still installed"; exit 1 }

  installers-macos:
    # Only when a release is published. A Mac minute costs the same as ten Linux minutes.
    if: github.event_name == 'release'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: install.sh
        run: |
          CREWCHAT_SOURCE="file://$PWD" sh install.sh
          export PATH="$HOME/.local/bin:$PATH" CREWCHAT_HOME="$RUNNER_TEMP/crewchat-home"
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project" && git init -q
          crewchat start --no-service --no-open
          crewchat status
          curl -sf "http://127.0.0.1:8765/manifest.webmanifest" > /dev/null
          crewchat cloud status || true
          "$(uv tool dir 2>/dev/null || echo "$HOME/.local/share/uv/tools")/crewchat/bin/python" -c "import google.cloud.firestore, cryptography"
          up() { curl -sf -m 3 http://127.0.0.1:8765/health > /dev/null; }
          crewchat stop
          if up; then echo "stop did not stop it"; exit 1; fi
          crewchat restart
          up || { echo "restart did not start it"; exit 1; }
          # An upgrade over a running server restarts it on the new code.
          starts() { grep -c ' for .* on http' "$CREWCHAT_HOME/hub.log"; }
          before=$(starts)
          CREWCHAT_SOURCE="file://$GITHUB_WORKSPACE" sh "$GITHUB_WORKSPACE/install.sh"
          up || { echo "an upgrade left the server stopped"; exit 1; }
          [ "$(starts)" -gt "$before" ] || { echo "an upgrade did not restart the server"; exit 1; }
          crewchat uninstall --yes
          if up; then echo "uninstall left the server running"; exit 1; fi
          hash -r  # bash remembers where it last ran crewchat; ask afresh
          if [ -e "$HOME/.local/bin/crewchat" ] || command -v crewchat; then echo "the program is still installed"; exit 1; fi
          if [ -e .mcp.json ]; then echo "uninstall left .mcp.json"; exit 1; fi
          [ -e "$CREWCHAT_HOME/config.json" ] || { echo "uninstall deleted the chats without --purge"; exit 1; }
