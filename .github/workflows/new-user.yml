name: new user

# The install commands exactly as the README gives them, run on fresh machines against what is
# published (raw.githubusercontent.com and the release), then a first `crewchat start`.

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1"  # weekly: each run downloads the release from 5 machines, and GitHub counts them

jobs:
  # release-assets.yml publishes a release to PyPI and attaches its package just after it is
  # published: wait for both, so a new release is tested as people will install it.
  package:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - run: |
          for i in $(seq 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -q '\.whl$' &&
               curl -sf "https://pypi.org/pypi/crewchat/${TAG#v}/json" > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "$TAG is not on PyPI with its package after 10 minutes"; exit 1

  windows:
    needs: package
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh, cmd]  # where the user types the command
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # Right after a release, the PyPI server this runner reaches may still serve the one before:
      # wait until it lists this one, so the README's commands below get it the first time.
      - name: Wait for this runner's PyPI to list the release
        if: github.event_name == 'release'
        shell: powershell
        run: |
          $want = $env:TAG.TrimStart('v')
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $index = Invoke-RestMethod https://pypi.org/simple/crewchat/ -Headers @{ Accept = 'application/vnd.pypi.simple.v1+json' }
              if ($index.versions -contains $want) { exit 0 }
            } catch { }
            Start-Sleep -Seconds 10
          }
          "PyPI here does not list $want after 10 minutes"; exit 1
      - name: The README's commands, typed in powershell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          & "$env:USERPROFILE\.local\bin\uv.exe" tool install --python 3.12 "crewchat[cloud]"
      - name: The README's commands, typed in pwsh
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          & "$env:USERPROFILE\.local\bin\uv.exe" tool install --python 3.12 "crewchat[cloud]"
      - name: The README's commands, typed in cmd
        if: matrix.shell == 'cmd'
        shell: cmd
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          "%USERPROFILE%\.local\bin\uv.exe" tool install --python 3.12 "crewchat[cloud]"
      - name: A first chat
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          $v = crewchat --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host $v
          if ($env:TAG -and $v -ne "crewchat $($env:TAG.TrimStart('v'))") { "expected $env:TAG"; exit 1 }
          New-Item -ItemType Directory "$env:RUNNER_TEMP\notes-app" | Out-Null
          Set-Location "$env:RUNNER_TEMP\notes-app"
          git init -q
          crewchat start --no-service --no-open
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/health).Content
          crewchat status
          if ($LASTEXITCODE -ne 0) { exit 1 }

  unix:
    needs: package
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Wait for this runner's PyPI to list the release
        if: github.event_name == 'release'
        run: |
          for i in $(seq 60); do
            curl -sf -H 'Accept: application/vnd.pypi.simple.v1+json' https://pypi.org/simple/crewchat/ |
              grep -q "\"${TAG#v}\"" && exit 0
            sleep 10
          done
          echo "PyPI here does not list ${TAG#v} after 10 minutes"; exit 1
      - name: The README's command
        run: curl -LsSf https://raw.githubusercontent.com/deepankar17/crewchat/main/install.sh | sh
      - name: A first chat
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          crewchat --version
          if [ -n "$TAG" ] && [ "$(crewchat --version)" != "crewchat ${TAG#v}" ]; then echo "expected $TAG"; exit 1; fi
          mkdir "$RUNNER_TEMP/notes-app" && cd "$RUNNER_TEMP/notes-app" && git init -q
          crewchat start --no-service --no-open
          curl -sf http://127.0.0.1:8765/health
          crewchat status
