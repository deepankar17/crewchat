name: release assets

# Every release carries crewchat's package file (a wheel, plus the source package). The installers
# install that wheel, so GitHub's download count for it counts installs; nothing else is sent.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.9.7"
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build --wheel --sdist
      - name: Check the version matches the tag
        run: ls dist/crewchat-${TAG#v}-py3-none-any.whl
      - name: Attach what is missing
        run: |
          have=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in dist/*.whl dist/*.tar.gz; do
            if echo "$have" | grep -qx "$(basename "$f")"; then echo "already there: $f"
            else gh release upload "$TAG" "$f"; fi
          done
