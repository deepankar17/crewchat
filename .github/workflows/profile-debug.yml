name: profile debug

on:
  push:
    branches: [ci/new-user]
  workflow_dispatch:

jobs:
  with-profile:
    runs-on: windows-latest
    steps:
      - name: The owner's profile
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force (Split-Path $PROFILE) | Out-Null
          Set-Content -Path $PROFILE -Value @'
          function claude-personal {
              $env:CLAUDE_CONFIG_DIR = "$HOME\.claude_personal"
              try { claude @args } finally { Remove-Item Env:CLAUDE_CONFIG_DIR -ErrorAction SilentlyContinue }
          }
          '@
          Get-Content $PROFILE
      - name: The README's command, with that profile
        shell: cmd
        run: powershell -ExecutionPolicy ByPass -c "irm https://raw.githubusercontent.com/deepankar17/crewchat/main/install.ps1 | iex"
      - name: Look inside
        if: always()
        shell: cmd
        run: |
          powershell -c "$s = irm https://raw.githubusercontent.com/deepankar17/crewchat/main/install.ps1; 'type ' + $s.GetType().FullName; 'length ' + $s.Length; 'lines ' + ($s -split \"`n\").Count"
          powershell -c "irm https://raw.githubusercontent.com/deepankar17/crewchat/main/install.ps1 | ForEach-Object { 'piece of ' + $_.Length + ' chars' } | Select-Object -First 5"
          powershell -c "Get-Command claude -ErrorAction SilentlyContinue | Format-List *; $MyInvocation.Line"
