# Secret scanning rules for scripts/security-scan.sh: gitleaks' default rules plus the allowed
# values below. Add an entry here only for fake or public values, never to silence a real key.
[extend]
useDefault = true

[[allowlists]]
description = "Unit tests use made-up tokens and keys"
paths = ['''^tests/''']

[[allowlists]]
description = "Cloudflare Web Analytics beacon token: public by design, it ships in every page"
condition = "AND"
paths = ['''^site/config\.json$''']
regexTarget = "line"
regexes = ['''"cf_beacon_token"''']

[[allowlists]]
description = "SHA-256 checksums of the Firebase SDK files the hosted page loads (FIREBASE_FILES): public hashes, not keys"
condition = "AND"
paths = ['''^crewchat_cloud\.py$''', '''^crewchat\.py$''']
regexTarget = "line"
regexes = ['''^\s*"firebase-[a-z-]+\.js": "[0-9a-f]{64}",?$''']
