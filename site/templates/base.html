<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="crewchat">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{base_url}}/assets/media/screenshot-light.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/site.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to the content</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/"><img src="/favicon.svg" alt="" width="32" height="32"><span>crewchat</span></a>
      <nav class="nav-links" aria-label="Site">
        <a href="/#how">How it works</a>
        <a href="/#install">Install</a>
        <a href="{{docs}}">Docs</a>
        <a class="pill" href="{{github}}">GitHub</a>
      </nav>
    </div>
  </header>
  <main id="main">
{{> main}}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>crewchat {{version}} · MIT licence · © {{year}} deepankar17</div>
      <nav class="footer-links" aria-label="More">
        <a href="{{github}}">GitHub</a>
        <a href="{{pypi}}">PyPI</a>
        <a href="{{docs}}">Docs</a>
        <a href="{{youtube}}">Videos</a>
        <a href="/privacy.html">Privacy</a>
        <a href="{{github}}/issues">Questions and bugs</a>
      </nav>
    </div>
  </footer>
</body>
</html>
