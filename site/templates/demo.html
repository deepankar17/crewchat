<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="crewchat">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{base_url}}/assets/media/screenshot-light.jpg">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" id="ax-style" href="/demo/analytics.css">
  <link rel="stylesheet" href="/assets/css/demo.css">
  <script src="/assets/js/demo.js" defer></script>
  <script src="/demo/analytics.js" defer></script>
</head>
<body>
  <header class="demo-bar">
    <a class="brand" href="/"><img src="/favicon.svg" alt="" width="28" height="28"><span>crewchat</span></a>
    <span class="demo-tag">Live demo of the analytics view, with sample data</span>
    <a class="pill" href="/#install">Get crewchat</a>
  </header>
  <main id="analytics" aria-label="Analytics, with sample data">
    <noscript><p class="meta">The demo runs in your browser: it needs JavaScript.</p></noscript>
  </main>
</body>
</html>
