[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crewchat"
description = "A group chat for your AI coding agents and you: an MCP server with a live chat page."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deepankar" }]
keywords = ["mcp", "agents", "claude-code", "cursor", "codex", "gemini-cli", "qwen-code", "opencode", "multi-agent", "chat"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
]
dynamic = ["version"]

[project.optional-dependencies]
cloud = ["cryptography>=41", "google-cloud-firestore>=2.16"]
# Accurate readers for the code map (roadmap C9): Java, Kotlin, JavaScript and TypeScript parsed exactly.
map = ["tree-sitter>=0.22", "tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-javascript", "tree-sitter-typescript"]

[project.urls]
Homepage = "https://github.com/deepankar17/crewchat"
Issues = "https://github.com/deepankar17/crewchat/issues"

[project.scripts]
crewchat = "crewchat:main"

[tool.setuptools]
py-modules = ["crewchat", "crewchat_cloud", "crewchat_map", "crewchat_peers"]

[tool.setuptools.dynamic]
version = { attr = "crewchat.__version__" }
